name: ci

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest --disable-warnings --maxfail=1

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t healthcheck:${{ github.sha }} .

      - name: Run container
        run: |
          docker run -d \
            -p 8080:8080 \
            --name healthcheck \
            healthcheck:${{ github.sha }}

      - name: Wait for startup
        run: sleep 5

      - name: Health endpoint smoke test
        run: curl -f http://localhost:8080/health

      - name: Metrics endpoint smoke test
        run: curl -f http://localhost:8080/metrics

      - name: Cleanup
        if: always()
        run: docker rm -f healthcheck
