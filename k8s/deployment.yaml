apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcheck
  template:
    metadata:
      labels:
        app: healthcheck
    spec:
      containers:
      - name: app
        image: healthcheck:latest
        ports:
          - containerPort: 8080
        env:
          - name: PEER_URL
            value: http://healthcheck/health
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 5